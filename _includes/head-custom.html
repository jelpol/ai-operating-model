<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((el) => {
      const code = el.matches("code") ? el : el.querySelector("pre code, code");
      if (!code) return;
      const holder = el.matches("code") ? el.closest("pre") : el;
      const target = document.createElement("pre");
      target.className = "mermaid";
      target.textContent = code.textContent;
      holder.replaceWith(target);
    });
    mermaid.initialize({ startOnLoad: true, theme: "neutral" });
  });
</script>
